# Stack completa para o Coolify: aplicação + MySQL.
#
# Se você preferir usar um banco gerenciado pelo próprio Coolify, apague o
# serviço "mysql" e aponte DB_HOST para o host que o Coolify fornecer.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Contador de Carregamento}"
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"

      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: pt_BR

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-carregamento}"
      DB_USERNAME: "${DB_USERNAME:-carregamento}"
      DB_PASSWORD: "${DB_PASSWORD}"

      SESSION_DRIVER: database
      # 60 dias: o operador marca "manter conectado" e não quer logar de novo
      SESSION_LIFETIME: "86400"
      SESSION_SECURE_COOKIE: "true"

      CACHE_STORE: database
      QUEUE_CONNECTION: database

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
    volumes:
      # Só os logs e arquivos gerados precisam sobreviver ao redeploy
      - storage-app:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-carregamento}"
      MYSQL_USER: "${DB_USERNAME:-carregamento}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
  storage-app:
  storage-logs:
